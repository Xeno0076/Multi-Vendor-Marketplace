kind = "web"
previewPath = "/"
title = "Marketly Marketplace"
description = "A responsive multi-vendor marketplace foundation with a welcoming landing page for shoppers and independent sellers."
version = "1.0.0"
id = "artifacts/marketplace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20787

[services.development]
run = "pnpm --filter @workspace/marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketplace", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketplace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20787"
BASE_PATH = "/"
